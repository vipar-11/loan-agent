[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "loan-agent"
version = "0.1.0"
description = "Institutional Loan Underwriting & Approval Workbench"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Apex Financial Engineering Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.35.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "langchain-openai>=0.1.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["loan_agent*", "api*"]

[tool.setuptools.package-data]
api = ["templates/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
pythonpath = ["."]
markers = [
    "integration: marks tests as live LLM integration tests",
]

[tool.coverage.run]
source = ["loan_agent", "api"]
omit = ["app.py", "agentic_app.py", "tests/*"]

[tool.coverage.report]
show_missing = true
