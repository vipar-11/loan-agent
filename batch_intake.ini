; ---------------------------------------------------------------------------
; Partner batch intake — bulk loan applications from approved third parties
;
; Each approved partner uploads CSV batch files (see partner_kit/LOAN_BATCH_FILE_SPEC.md) over FTP into its own
; inbox folder:  <root_dir>/inbox/<PARTNER_ID>/      (configure the partner's FTP account home / chroot there)
; The service monitors the inboxes, submits every valid row as a NEW application, flags invalid rows, and
; writes a results file for the partner to collect from  <root_dir>/outbox/<PARTNER_ID>/
;
; Override the file location with BATCH_INTAKE_CONFIG, and individual settings with BATCH_INTAKE_ENABLED /
; BATCH_INTAKE_ROOT.
; ---------------------------------------------------------------------------
[batch_intake]
; Monitor the inbox from the running API service
enabled = true
; inbox/, processing/, archive/, rejected/ and outbox/ are created under this directory
root_dir = data/intake
; How often (seconds) the inbox folders are scanned
poll_seconds = 15
; A file is only picked up once it has not been modified for this many seconds (upload finished)
settle_seconds = 10
; File-level limits — larger files are rejected as a whole
max_file_bytes = 5242880
max_rows = 1000

[approved_partners]
; PARTNER_ID = Partner legal name
; PARTNER_ID is also the partner's inbox/outbox folder name: 2-32 characters, A-Z, 0-9 and underscore.
; Files arriving from any other folder are rejected without being read.
ACME_BROKERS = Acme Loan Brokers LLC
SUMMIT_FINANCIAL = Summit Financial Partners Inc.
