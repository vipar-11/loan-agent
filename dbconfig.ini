[storage]
# Storage mode: 'local' (SQLite database files) or 'remote' (e.g. PostgreSQL)
mode = local

[local]
# Local SQLite database paths (Application Database and LangGraph Checkpointer must be distinct)
app_db_path = data/loan_agent_app.db
langgraph_db_path = data/loan_agent_checkpoints.db

[remote]
# Remote database connection URLs (must be distinct databases)
app_db_url = postgresql://postgres:postgres@localhost:5432/loan_app_db
langgraph_db_url = postgresql://postgres:postgres@localhost:5432/loan_checkpoint_db

