[auth]
# Sign-in sessions (browser cookie and API bearer tokens alike).
# A session ends after session_idle_minutes without requests, and at the latest session_max_hours after sign-in.
session_idle_minutes = 30
session_max_hours = 12

# Browser session cookie. Set cookie_secure = true whenever the service is served over HTTPS
# (the cookie is then never sent over plain HTTP). It is always HttpOnly and SameSite=Lax.
cookie_name = apex_session
cookie_secure = false

# Account lockout: this many consecutive failed sign-ins lock the account for lockout_minutes.
lockout_threshold = 5
lockout_minutes = 15

# Password policy for new passwords (users set their own on first sign-in — see manage_users.py).
password_min_length = 8

# Environment overrides: AUTH_CONFIG (path to this file), AUTH_SESSION_IDLE_MINUTES, AUTH_SESSION_MAX_HOURS,
# AUTH_COOKIE_SECURE, AUTH_LOCKOUT_THRESHOLD, AUTH_LOCKOUT_MINUTES, AUTH_PASSWORD_MIN_LENGTH.
